<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,.15);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #nameAgain {
      display: none;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      word-break: break-word;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }
  </style>
</head>

<body>

  <div class="box">

    <!-- الصفحة الأولى -->
    <div id="signup">

      <h2>إنشاء حساب</h2>

      <form id="signupForm">

        <label>الاسم</label>
        <input
          type="text"
          id="name"
          placeholder="اكتب اسمك"
          required
        >

        <label>رقم التلفون</label>
        <input
          type="tel"
          id="phone"
          placeholder="اكتب رقم التلفون"
          required
        >

        <button type="submit">
          متابعة
        </button>

      </form>

    </div>


    <!-- الصفحة الثانية -->
    <div id="nameAgain">

      <h2>أدخل الاسم مرة تانية</h2>

      <p style="text-align:center;color:#666;">
        اكتب نفس الاسم للتأكيد
      </p>

      <input
        type="text"
        id="secondName"
        placeholder="اكتب الاسم مرة تانية"
      >

      <button id="saveButton">
        تأكيد
      </button>

      <div id="message" class="message"></div>

    </div>

  </div>


  <script>

    // بيانات Supabase
    const SUPABASE_URL =
      "https://ptzrolgwxprxviqxokkg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_t1RZwQ8y6lvw225QdygQ8g_vBgSvndg";


    // عناصر الصفحة
    const signup =
      document.getElementById("signup");

    const nameAgain =
      document.getElementById("nameAgain");

    const form =
      document.getElementById("signupForm");

    const secondName =
      document.getElementById("secondName");

    const saveButton =
      document.getElementById("saveButton");

    const message =
      document.getElementById("message");


    // تخزين البيانات مؤقتًا في الصفحة
    let originalName = "";
    let originalPhone = "";


    // عند الضغط على متابعة
    form.addEventListener("submit", function(event) {

      event.preventDefault();

      originalName =
        document.getElementById("name").value.trim();

      originalPhone =
        document.getElementById("phone").value.trim();


      if (
        originalName === "" ||
        originalPhone === ""
      ) {
        return;
      }


      // إخفاء الصفحة الأولى
      signup.style.display = "none";


      // إظهار الصفحة الثانية
      nameAgain.style.display = "block";


      secondName.focus();

    });


    // عند الضغط على تأكيد
    saveButton.addEventListener(
      "click",
      async function() {

        const enteredName =
          secondName.value.trim();

        message.textContent = "";


        // التأكد أن الاسم مكتوب
        if (enteredName === "") {

          message.textContent =
            "اكتب الاسم";

          message.className =
            "message error";

          return;
        }


        // التأكد أن الاسم مطابق
        if (enteredName !== originalName) {

          message.textContent =
            "الاسم غير مطابق";

          message.className =
            "message error";

          return;
        }


        // تعطيل الزر أثناء الحفظ
        saveButton.disabled = true;

        saveButton.textContent =
          "جاري الحفظ...";


        try {

          const response =
            await fetch(
              SUPABASE_URL + "/rest/v1/users",
              {
                method: "POST",

                headers: {
                  "apikey": SUPABASE_KEY,

                  "Authorization":
                    "Bearer " + SUPABASE_KEY,

                  "Content-Type":
                    "application/json",

                  "Prefer":
                    "return=minimal"
                },

                body: JSON.stringify({
                  name: originalName,
                  phone: originalPhone
                })
              }
            );


          // لو حصل خطأ من Supabase
          if (!response.ok) {

            const errorText =
              await response.text();

            console.error(
              "Supabase error:",
              errorText
            );

            throw new Error(errorText);
          }


          // نجاح
          message.textContent =
            "تم التسجيل بنجاح ✓";

          message.className =
            "message success";

          saveButton.textContent =
            "تم الحفظ";


        } catch (error) {

          console.error(error);

          message.textContent =
            "حدث خطأ أثناء التسجيل";

          message.className =
            "message error";

          saveButton.disabled = false;

          saveButton.textContent =
            "تأكيد";
        }

      }
    );

  </script>

</body>
</html>
