<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب</title>

  <style>
    body {
      font-family: Arial;
      background: #f3f3f3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      background: white;
      width: 350px;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px #ccc;
    }

    h2 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 7px 0 15px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #222;
      color: white;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>إنشاء حساب</h2>

    <form>
      <label>الاسم</label>
      <input type="text" required>

      <label>رقم التلفون</label>
      <input type="tel" required>

      <label>إنشاء كلمة مرور</label>
      <input type="password" required>

      <label>تأكيد كلمة المرور</label>
      <input type="password" required>

      <button type="submit">إرسال</button>
    </form>
  </div>

</body>
</html>
